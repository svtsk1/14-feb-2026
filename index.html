<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Для тебя 💖</title>

<style>
body {
  background: linear-gradient(120deg, #ff9a9e, #fad0c4);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  margin: 0;
}

.card {
  background: white;
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,.2);
  text-align: center;
  width: 420px;
  position: relative;
}

h1 { margin-top: 0; }

button {
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  background: #ff4d6d;
  color: white;
  font-size: 16px;
  cursor: pointer;
  margin-top: 15px;
}

.buttons {
  position: relative;
  height: 120px; /* зона для хаоса */
  margin-top: 20px;
  border-radius: 15px;
}

#yes {
  position: relative;
  z-index: 2;
}

#no {
  position: absolute;
  background: #ccc;
  color: #333;
  transition: top 0.07s linear, left 0.07s linear, transform 0.07s linear;
}

#timer {
  margin-top: 20px;
  font-size: 14px;
  color: #555;
}

/* Галерея */
.gallery {
  display: none;
  margin-top: 20px;
}

.gallery img {
  width: 100%;
  border-radius: 15px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: transform 0.3s;
}

.gallery img:hover {
  transform: scale(1.03);
}

/* Лайтбокс */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
}

.lightbox img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 20px;
}

</style>
</head>

<body>

<div class="card">
  <h1>С 14 февраля 💘</h1>
  <p>Ты делаешь мой мир лучше каждый день</p>

  <h3>Ты будешь моей валентинкой? 💖</h3>

  <div class="buttons">
    <button id="yes">Да ❤️</button>
    <button id="no">Нет 💔</button>
  </div>

  <p id="timer"></p>

  <button id="music-btn">🎶 Включить нашу песню</button>
  <audio id="music" src="music.mp3"></audio>

  <div class="gallery" id="gallery">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
    <img src="photo5.jpg">
    <img src="photo6.jpg">
    <img src="photo7.jpg">
    <img src="photo8.jpg">
  </div>
</div>

<div class="lightbox" id="lightbox">
  <img id="lightbox-img">
</div>

<script>

/* ========= ПАНИЧЕСКАЯ КНОПКА "НЕТ" ========= */

const noBtn = document.getElementById('no');
const buttonsArea = document.querySelector('.buttons');

function moveButton() {
  const maxX = buttonsArea.clientWidth - noBtn.clientWidth;
  const maxY = buttonsArea.clientHeight - noBtn.clientHeight;

  const randomX = Math.random() * maxX;
  const randomY = Math.random() * maxY;

  const randomRotate = Math.random() * 60 - 30; // -30° до +30°
  const randomScale = 0.9 + Math.random() * 0.4;

  noBtn.style.left = randomX + 'px';
  noBtn.style.top = randomY + 'px';
  noBtn.style.transform = `rotate(${randomRotate}deg) scale(${randomScale})`;
}

noBtn.addEventListener('mouseenter', moveButton);
noBtn.addEventListener('click', moveButton);

/* ========= КНОПКА "ДА" ========= */

document.getElementById('yes').addEventListener('click', () => {
  alert('Я тебя очень люблю ❤️');

  document.getElementById('gallery').style.display = 'block';
});

/* ========= ТАЙМЕР (ИСПРАВЛЕННЫЙ) ========= */
/* ВАЖНО: месяц считается с 0!
   январь=0, февраль=1, март=2 ... */

const startDate = new Date(2020, 10, 13); // ← поменяй на вашу дату

function updateTimer() {
  const now = new Date();
  const diff = now - startDate;

  if (diff < 0) return;

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
  const minutes = Math.floor(diff / (1000 * 60)) % 60;

  document.getElementById('timer').innerText =
    `Мы вместе уже ${days} дней ${hours} часов ${minutes} минут 💕`;
}

setInterval(updateTimer, 1000);
updateTimer();

/* ========= МУЗЫКА ========= */

const music = document.getElementById('music');
const musicBtn = document.getElementById('music-btn');

musicBtn.addEventListener('click', () => {
  if (music.paused) {
    music.play();
    musicBtn.innerText = '⏸ Пауза';
  } else {
    music.pause();
    musicBtn.innerText = '🎶 Включить нашу песню';
  }
});

/* ========= ЛАЙТБОКС ========= */

const images = document.querySelectorAll('.gallery img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

images.forEach(img => {
  img.addEventListener('click', () => {
    lightbox.style.display = 'flex';
    lightboxImg.src = img.src;
  });
});

lightbox.addEventListener('click', () => {
  lightbox.style.display = 'none';
});

</script>

</body>
</html>
