<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Для тебя 💖</title>

<style>
body {
  background: linear-gradient(120deg, #ff9a9e, #fad0c4);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  margin: 0;
}

.card {
  background: white;
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,.2);
  text-align: center;
  width: 420px;
  position: relative;
}

h1 { margin-top: 0; }

button {
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  background: #ff4d6d;
  color: white;
  font-size: 16px;
  cursor: pointer;
  margin-top: 15px;
}

.buttons {
  position: relative;
  height: 120px;
  margin-top: 20px;
  border-radius: 15px;
}

#yes {
  position: relative;
}

#no {
  position: absolute;
  background: #ccc;
  color: #333;
  transition: top 0.07s linear, left 0.07s linear, transform 0.07s linear;
}

#timer {
  margin-top: 20px;
  font-size: 14px;
  color: #555;
}

/* Галерея */
.gallery {
  display: none;
  margin-top: 20px;
}

.gallery img {
  width: 100%;
  border-radius: 15px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: transform 0.3s;
}

.gallery img:hover {
  transform: scale(1.03);
}

/* Лайтбокс */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
}

.lightbox img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 20px;
}

/* Кастомное окно */
.custom-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: white;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  animation: pop 0.3s ease;
}

@keyframes pop {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

</style>
</head>

<body>

<div class="card">
  <h1>С 14 февраля 💘</h1>
  <p>Ты делаешь мой мир лучше каждый день</p>

  <h3>Ты будешь моей валентинкой? 💖</h3>

  <div class="buttons">
    <button id="yes">Да ❤️</button>
    <button id="no">Нет 💔</button>
  </div>

  <p id="timer"></p>

  <button id="music-btn">🎶 Включить песню на фон</button>
  <audio id="music" src="music.mp3"></audio>

  <div class="gallery" id="gallery">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
    <img src="photo5.jpg">
    <img src="photo6.jpg">
    <img src="photo7.jpg">
    <img src="photo8.jpg">
    <img src="photo9.jpg">
    <img src="photo10.jpg">
    <img src="photo11.jpg">
    <img src="photo12.jpg">
    <img src="photo13.jpg">
    <img src="photo14.jpg">
    <img src="photo15.jpg">
  </div>
</div>

<!-- Модальное окно -->
<div class="custom-modal" id="customModal">
  <div class="modal-content">
    <h2>Я тебя очень люблю ❤️</h2>
    <button id="closeModal">Поцеловать 😘</button>
  </div>
</div>

<!-- Лайтбокс -->
<div class="lightbox" id="lightbox">
  <img id="lightbox-img">
</div>

<script>

/* ========= ПАНИЧЕСКАЯ КНОПКА "НЕТ" ========= */
const noBtn = document.getElementById('no');
const buttonsArea = document.querySelector('.buttons');

// стартовая позиция
noBtn.style.left = "150px";
noBtn.style.top = "40px";

function moveButtonFarFromCursor(mouseX, mouseY) {

  const areaRect = buttonsArea.getBoundingClientRect();
  const btnWidth = noBtn.offsetWidth;
  const btnHeight = noBtn.offsetHeight;

  const maxX = buttonsArea.clientWidth - btnWidth;
  const maxY = buttonsArea.clientHeight - btnHeight;

  let bestX = 0;
  let bestY = 0;
  let maxDistance = 0;

  // пробуем несколько случайных позиций и выбираем самую далёкую
  for (let i = 0; i < 10; i++) {
    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    const btnCenterX = areaRect.left + x + btnWidth / 2;
    const btnCenterY = areaRect.top + y + btnHeight / 2;

    const distance = Math.hypot(mouseX - btnCenterX, mouseY - btnCenterY);

    if (distance > maxDistance) {
      maxDistance = distance;
      bestX = x;
      bestY = y;
    }
  }

  const randomRotate = Math.random() * 80 - 40;
  const randomScale = 0.9 + Math.random() * 0.4;

  noBtn.style.left = bestX + "px";
  noBtn.style.top = bestY + "px";
  noBtn.style.transform = `rotate(${randomRotate}deg) scale(${randomScale})`;
}

// убегает при движении мыши внутри зоны
buttonsArea.addEventListener('mousemove', (e) => {

  const btnRect = noBtn.getBoundingClientRect();

  const distance = Math.hypot(
    e.clientX - (btnRect.left + btnRect.width / 2),
    e.clientY - (btnRect.top + btnRect.height / 2)
  );

  if (distance < 100) { // чем меньше — тем злее
    moveButtonFarFromCursor(e.clientX, e.clientY);
  }
});


/* ========= КНОПКА "ДА" + МОДАЛКА ========= */

const modal = document.getElementById('customModal');
const closeModal = document.getElementById('closeModal');
const gallery = document.getElementById('gallery');

document.getElementById('yes').addEventListener('click', () => {
  modal.style.display = 'flex';
});

closeModal.addEventListener('click', () => {
  modal.style.display = 'none';
  gallery.style.display = 'block';
});


/* ========= ТАЙМЕР ========= */
/* ВАЖНО: месяц с 0!
   январь=0, февраль=1 и т.д. */

const startDate = new Date(2020, 10, 13); // ← измени на вашу дату

function updateTimer() {
  const now = new Date();
  const diff = now - startDate;

  if (diff < 0) return;

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
  const minutes = Math.floor(diff / (1000 * 60)) % 60;

  document.getElementById('timer').innerText =
    `Мы вместе уже ${days} дней ${hours} часов ${minutes} минут 💕`;
}

setInterval(updateTimer, 1000);
updateTimer();


/* ========= МУЗЫКА ========= */

const music = document.getElementById('music');
const musicBtn = document.getElementById('music-btn');

musicBtn.addEventListener('click', () => {
  if (music.paused) {
    music.play();
    musicBtn.innerText = '⏸ Пауза';
  } else {
    music.pause();
    musicBtn.innerText = '🎶 Вернуть песню на фон';
  }
});


/* ========= ЛАЙТБОКС ========= */

const images = document.querySelectorAll('.gallery img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

images.forEach(img => {
  img.addEventListener('click', () => {
    lightbox.style.display = 'flex';
    lightboxImg.src = img.src;
  });
});

lightbox.addEventListener('click', () => {
  lightbox.style.display = 'none';
});

</script>

</body>
</html>
