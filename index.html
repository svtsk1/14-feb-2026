<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Для тебя 💖</title>

<style>
body {
  background: linear-gradient(120deg, #ff9a9e, #fad0c4);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  margin: 0;
}

.card {
  background: white;
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,.2);
  text-align: center;
  width: 420px;
  position: relative;
  overflow: hidden;
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  background: #ff4d6d;
  color: white;
  font-size: 16px;
  cursor: pointer;
  margin-top: 15px;
}

.buttons {
  position: relative;
  height: 60px;
  margin-top: 15px;
}

#no {
  position: absolute;
  background: #ccc;
  color: #333;
}

#timer {
  margin-top: 20px;
  font-size: 14px;
  color: #555;
}

/* Галерея */
.gallery {
  display: none;
  margin-top: 20px;
}

.gallery img {
  width: 100%;
  border-radius: 15px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: transform 0.3s;
}

.gallery img:hover {
  transform: scale(1.03);
}

/* Лайтбокс */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
}

.lightbox img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 20px;
}
</style>
</head>

<body>

<div class="card">
  <h1>С 14 февраля 💘</h1>
  <p>Ты делаешь мой мир лучше каждый день</p>

  <h3>Ты будешь моей валентинкой? 💖</h3>

  <div class="buttons">
    <button id="yes">Да ❤️</button>
    <button id="no">Нет 💔</button>
  </div>

  <p id="timer"></p>

  <button id="music-btn">🎶 Включить нашу песню</button>
  <audio id="music" src="music.mp3"></audio>

  <div class="gallery" id="gallery">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
  </div>
</div>

<div class="lightbox" id="lightbox">
  <img id="lightbox-img">
</div>

<script>

// ❤️ Убегающая кнопка по всей карточке
const noBtn = document.getElementById('no');
const card = document.querySelector('.card');

noBtn.addEventListener('mouseover', () => {
  const maxX = card.clientWidth - noBtn.clientWidth;
  const maxY = card.clientHeight - noBtn.clientHeight;

  const randomX = Math.random() * maxX;
  const randomY = Math.random() * maxY;

  noBtn.style.left = randomX + 'px';
  noBtn.style.top = randomY + 'px';
});

// 💖 Кнопка "Да"
document.getElementById('yes').addEventListener('click', () => {
  alert('Я тебя очень люблю ❤️');

  document.getElementById('gallery').style.display = 'block';
});

// ⏳ Таймер (укажи правильную дату!)
const startDate = new Date(2020, 10, 13); // 1 июня 2023

function updateTimer() {
  const now = new Date();
  const diff = now - startDate;

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
  const minutes = Math.floor(diff / (1000 * 60)) % 60;

  document.getElementById('timer').innerText =
    `Мы вместе уже ${days} дней ${hours} часов ${minutes} минут 💕`;
}

setInterval(updateTimer, 1000);
updateTimer();

// 🎶 Музыка
const music = document.getElementById('music');
const musicBtn = document.getElementById('music-btn');

musicBtn.addEventListener('click', () => {
  if (music.paused) {
    music.play();
    musicBtn.innerText = '⏸ Пауза';
  } else {
    music.pause();
    musicBtn.innerText = '🎶 Включить нашу песню';
  }
});

// 📸 Лайтбокс
const images = document.querySelectorAll('.gallery img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

images.forEach(img => {
  img.addEventListener('click', () => {
    lightbox.style.display = 'flex';
    lightboxImg.src = img.src;
  });
});

lightbox.addEventListener('click', () => {
  lightbox.style.display = 'none';
});

</script>
</body>
</html>
