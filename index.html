<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Для тебя 💖</title>

  <style>
    body {
      background: linear-gradient(120deg, #ff9a9e, #fad0c4);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
      max-width: 420px;
      width: 100%;
    }

    h1 {
      margin-top: 0;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #ff4d6d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .buttons {
      position: relative;
      height: 50px;
      margin-top: 20px;
    }

    #yes {
      background: #ff4d6d;
    }

    #no {
      background: #ccc;
      color: #333;
      position: absolute;
      left: 200px;
      top: 0;
    }

    #timer {
      margin-top: 20px;
      font-size: 14px;
      color: #555;
    }

    /* 📸 Галерея */
    .gallery {
      margin-top: 25px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .gallery img {
      width: 100%;
      border-radius: 12px;
      object-fit: cover;
      height: 120px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>С 14 февраля 💘</h1>
    <p>Ты делаешь мой мир лучше каждый день</p>

    <h3>Ты будешь моей валентинкой? 💖</h3>

    <div class="buttons">
      <button id="yes">Да ❤️</button>
      <button id="no">Нет 💔</button>
    </div>

    <p id="timer"></p>

    <button id="music-btn">🎶 Включить нашу песню</button>
    <audio id="music" src="music.mp3"></audio>

    <!-- 📸 Фото -->
    <div class="gallery">
      <img src="photo1.jpg" alt="Мы вместе">
      <img src="photo2.jpg" alt="Мы вместе">
      <img src="photo3.jpg" alt="Мы вместе">
      <img src="photo4.jpg" alt="Мы вместе">
    </div>
  </div>

  <script>
    // 💔 Убегающая кнопка "Нет"
    const noBtn = document.getElementById('no');

    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * 200;
      const y = Math.random() * 30;
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    });

    // ❤️ Кнопка "Да"
    document.getElementById('yes').addEventListener('click', () => {
      alert('Я так и знал 😌 Я тебя очень люблю ❤️');
    });

    // ⏳ Таймер (ПОМЕНЯЙ ДАТУ)
    const startDate = new Date('2023-06-01T00:00:00');

    function updateTimer() {
      const now = new Date();
      const diff = now - startDate;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
      const minutes = Math.floor(diff / (1000 * 60)) % 60;

      document.getElementById('timer').innerText =
        `Мы знакомы уже ${days} дней ${hours} часов ${minutes} минут 💕`;
    }

    setInterval(updateTimer, 1000);
    updateTimer();

    // 🎶 Музыка
    const music = document.getElementById('music');
    const musicBtn = document.getElementById('music-btn');

    musicBtn.addEventListener('click', () => {
      if (music.paused) {
        music.play();
        musicBtn.innerText = '⏸ Пауза';
      } else {
        music.pause();
        musicBtn.innerText = '🎶 Включить нашу песню';
      }
    });
  </script>
</body>
</html>
